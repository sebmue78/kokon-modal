name: Windows alpha (fork)

# Fork (kokon-modal): builds the Windows installer with FLUX.3, Fibo 2.0, Krea 2 and MOSS-Image on GitHub's Windows
# runner and publishes it as a pre-release v<version>-alpha. Started by a push to the branch
# alpha-release (or by hand in the Actions tab).
#
# Versions: every build gets its own, higher version, so the in-app updater can offer it:
# <major>.<minor>.<patch * 1000 + run number> of the version in tauri.conf.json (0.11.1, run 12 →
# 0.11.1012). It is set for the build only, not committed.
#
# Updates: with the repository secret TAURI_SIGNING_PRIVATE_KEY (the fork's updater key; its public
# half is in tauri.conf.json) the installer is signed for the updater and latest.json is uploaded
# to the fixed release "updates", which the app checks once a day. Without the secret the build
# works as before, just without an update.
#
# Differences to the maintainer's scripts\build-release.ps1:
# - Kokon Modal is its own app (identifier app.kokonmodal.desktop), installed next to Kokon;
# - its own updater key and update address (this repository);
# - the installer is not code-signed (Windows SmartScreen asks once).
on:
  push:
    branches: [alpha-release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and the tags: the release notes list the commits since the last alpha.
          fetch-depth: 0

      - name: Version
        id: ver
        shell: bash
        run: |
          base=$(node -p "require('./src-tauri/tauri.conf.json').version")
          IFS=. read -r major minor patch <<< "${base%%-*}"
          version="${major}.${minor}.$((patch * 1000 + GITHUB_RUN_NUMBER))"
          node -e "const f='src-tauri/tauri.conf.json',fs=require('fs');const c=JSON.parse(fs.readFileSync(f));c.version='$version';fs.writeFileSync(f,JSON.stringify(c,null,2)+'\\n')"
          node -e "const f='package.json',fs=require('fs');const c=JSON.parse(fs.readFileSync(f));c.version='$version';fs.writeFileSync(f,JSON.stringify(c,null,2)+'\\n')"
          sed -i "0,/^version = \".*\"/s//version = \"$version\"/" Cargo.toml
          grep -n '^version' Cargo.toml
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$HAS_KEY" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi
          node -e "const f='package-lock.json',fs=require('fs');const c=JSON.parse(fs.readFileSync(f));c.version='$version';if(c.packages&&c.packages['']){c.packages[''].version='$version'};fs.writeFileSync(f,JSON.stringify(c,null,2)+'\\n')"
          if [ -n "$HAS_KEY" ]; then echo "Kokon Modal $version, signed for the updater"; else echo "Kokon Modal $version, no updater key: no update manifest"; fi
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && 'yes' || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          (cd mcp && npm ci)

      - name: Tests (Rust core + UI)
        shell: bash
        run: |
          cargo test -p qls-core -p qls-service --release --quiet
          npx tsc --noEmit
          npx vitest run

      - name: UI (embedded in kokon-service)
        shell: bash
        run: npm run build

      - name: kokon-service (release)
        shell: bash
        run: |
          cargo build -p qls-service --release
          mkdir -p src-tauri/binaries
          cp target/release/kokon-service.exe src-tauri/binaries/kokon-service-x86_64-pc-windows-msvc.exe

      - name: kokon-mcp.exe
        shell: bash
        run: cd mcp && npm run build:exe

      - name: Desktop app + NSIS installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Updater artifacts (the installer's .sig) only with the signing key.
          cat > src-tauri/alpha.conf.json <<JSON
          { "bundle": { "createUpdaterArtifacts": ${{ steps.ver.outputs.signed }} } }
          JSON
          npx tauri build --config src-tauri/alpha.conf.json

      - name: Collect installer
        id: art
        shell: bash
        run: |
          setup=$(ls -t target/release/bundle/nsis/*.exe | head -1)
          mkdir -p dist-release
          version="${{ steps.ver.outputs.version }}"
          tag="v${version}-alpha"
          # GitHub turns spaces in asset names into dots: a space-free name the manifest can point to.
          name="Kokon-modal_${version}_x64-setup.exe"
          cp "$setup" "dist-release/$name"
          if [ -f "$setup.sig" ]; then
            node -e "
              const fs = require('fs');
              const m = { version: '$version', notes: 'Kokon Modal $version (Windows alpha). See the release notes on GitHub.', pub_date: new Date().toISOString(),
                platforms: { 'windows-x86_64': { signature: fs.readFileSync(process.argv[1], 'utf8').trim(), url: 'https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/$name' } } };
              fs.writeFileSync('dist-release/latest.json', JSON.stringify(m, null, 2));
            " "$setup.sig"
            cat dist-release/latest.json
          fi
          cp target/release/kokon-service.exe dist-release/
          sha=$(sha256sum "dist-release/$name" | cut -d' ' -f1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: kokon-modal-windows
          path: dist-release/

      - name: Pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # What changed: .github/alpha-notes.md (written for each release), then every commit since
          # the previous alpha.
          prev=$(git tag --list 'v*-alpha*' --sort=-creatordate | grep -vx "${{ steps.art.outputs.tag }}" | head -1)
          {
            echo "## What's new in this version"
            echo
            if [ -f .github/alpha-notes.md ]; then cat .github/alpha-notes.md; else echo "See the commits below."; fi
            echo
            if [ -n "$prev" ]; then
              echo "<details><summary>All changes since $prev</summary>"
              echo
              git log --no-merges --format='- %s (%h)' "$prev..HEAD"
              echo
              echo "</details>"
              echo
            fi
            echo "---"
            echo
          } > changes.md
          cat changes.md
          cat > about.md <<EOF
          **Alpha, not tested on a GPU yet.** Kokon Modal is a fork of [Kokon](https://github.com/GabrieleLozupone/kokon)
          by Gabriele Lozupone, with more models to choose in the model menu at the top, next to Qwen-Image 2.1:

          - **FLUX.3 Image Klein** (5.6B, 16 steps; new images, edits of a whole photo and combining up to 10 images;
            FLUX Kommunity License: non-commercial, commercial outputs only for qualifying users)
          - **Fibo 2.0 Dev and Edit Turbo** (8B, by Bria; Dev: new images and edits, 20 steps; Edit Turbo: edits only, 4 steps;
            CC BY-NC 4.0, non-commercial only)
          - **Krea 2 Turbo** (12.9B, 8 steps, up to 2K; Krea 2 Community License)
          - **MOSS-Image SFT** (5B, 20 steps with CFG and negative prompts; Apache-2.0)

          Krea 2 and MOSS make images from text and do brushed changes and Expand as plain inpainting. Each model
          downloads its files the first time it is chosen in the model menu, and each has its own LoRAs: load a LoRA
          for the model in use in Settings → LoRA (LoRAs for the new models are not tested yet).
          **Layout** (next to the aspect ratio) draws boxes that say where things go in a new image.

          Notes:
          - Its own app: installs next to Kokon (own folders, settings, gallery, models and ports), both can run at the same time.
            Models are downloaded again for Kokon Modal, or point it at Kokon's files with Settings → Models → Use my own files.
          - Not code-signed: Windows SmartScreen may ask once (More info → Run anyway).
          - Updates: Kokon Modal checks this repository once a day and installs a new version in one click (it can be
            turned off in Settings → General). Alphas up to v0.11.1-modal-alpha.10 have no updater: install a newer one by hand once.

          SHA-256 of \`${{ steps.art.outputs.name }}\`: \`${{ steps.art.outputs.sha }}\`
          EOF
          cat changes.md about.md > notes.md
          gh release create "${{ steps.art.outputs.tag }}" --target "$GITHUB_SHA" --prerelease --title "Kokon Modal ${{ steps.ver.outputs.version }} (Windows alpha)" \
            --notes-file notes.md "dist-release/${{ steps.art.outputs.name }}"

      - name: Update manifest
        if: steps.ver.outputs.signed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The fixed release "updates" holds latest.json, the address in tauri.conf.json (a pre-release
          # is never "latest", so releases/latest/download would not find it).
          gh release view updates >/dev/null 2>&1 || gh release create updates --prerelease --title "Update manifest" \
            --notes "latest.json for Kokon Modal's in-app updater. Not an installer: download Kokon Modal from the other releases."
          gh release upload updates dist-release/latest.json --clobber
