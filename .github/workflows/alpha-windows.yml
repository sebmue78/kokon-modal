name: Windows alpha (fork)

# Fork (kokon-modal): builds the Windows installer with Krea 2 and MOSS-Image on GitHub's Windows
# runner and publishes it as a pre-release v<version>-modal-alpha.<run number>. Started by a push to
# the branch alpha-release (or by hand in the Actions tab).
#
# Differences to the maintainer's scripts\build-release.ps1:
# - no updater signing key: the installer is built without updater artifacts, and the in-app
#   updater points at this fork (which publishes no latest.json), so an alpha is never replaced
#   by an upstream Kokon release;
# - the installer is not code-signed (Windows SmartScreen asks once).
on:
  push:
    branches: [alpha-release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          (cd mcp && npm ci)

      - name: Tests (Rust core + UI)
        shell: bash
        run: |
          cargo test -p qls-core -p qls-service --release --quiet
          npx tsc --noEmit
          npx vitest run

      - name: UI (embedded in kokon-service)
        shell: bash
        run: npm run build

      - name: kokon-service (release)
        shell: bash
        run: |
          cargo build -p qls-service --release
          mkdir -p src-tauri/binaries
          cp target/release/kokon-service.exe src-tauri/binaries/kokon-service-x86_64-pc-windows-msvc.exe

      - name: kokon-mcp.exe
        shell: bash
        run: cd mcp && npm run build:exe

      - name: Desktop app + NSIS installer
        shell: bash
        run: |
          cat > src-tauri/alpha.conf.json <<'JSON'
          {
            "bundle": { "createUpdaterArtifacts": false },
            "plugins": { "updater": { "endpoints": ["https://github.com/sebmue78/kokon-modal/releases/latest/download/latest.json"] } }
          }
          JSON
          npx tauri build --config src-tauri/alpha.conf.json

      - name: Collect installer
        id: art
        shell: bash
        run: |
          setup=$(ls -t target/release/bundle/nsis/*.exe | head -1)
          mkdir -p dist-release
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v${version}-modal-alpha.${GITHUB_RUN_NUMBER}"
          name="Kokon-modal_${version}-alpha.${GITHUB_RUN_NUMBER}_x64-setup.exe"
          cp "$setup" "dist-release/$name"
          cp target/release/kokon-service.exe dist-release/
          sha=$(sha256sum "dist-release/$name" | cut -d' ' -f1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: kokon-modal-windows
          path: dist-release/

      - name: Pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<EOF
          **Alpha, not tested on a GPU yet.** Kokon (fork kokon-modal) with two more models to choose in
          Settings → Models, next to Qwen-Image 2.1:

          - **Krea 2 Turbo** (12.9B, 8 steps, up to 2K; Krea 2 Community License)
          - **MOSS-Image SFT** (5B, 20 steps with CFG and negative prompts; Apache-2.0)

          Both make images from text, and do brushed changes and Expand as plain inpainting. Whole-photo
          edits, combining images and LoRAs need Qwen-Image 2.1. Each model downloads its files the first
          time it is chosen (Settings → Models → Download…).

          Notes:
          - Installs over an existing Kokon (same app); settings, gallery and models are kept.
          - Not code-signed: Windows SmartScreen may ask once (More info → Run anyway).
          - No automatic updates for this alpha.

          SHA-256 of \`${{ steps.art.outputs.name }}\`: \`${{ steps.art.outputs.sha }}\`
          EOF
          gh release create "${{ steps.art.outputs.tag }}" --target "$GITHUB_SHA" --prerelease --title "Kokon modal ${{ steps.art.outputs.tag }} (Windows alpha)" \
            --notes-file notes.md "dist-release/${{ steps.art.outputs.name }}"
